        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600;700&display=swap');
        
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #050811;
            color: #d1d5db;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* Dynamic Viewport Height for Mobile Browsers */
        }

        .font-tech {
            font-family: 'Share Tech Mono', monospace;
        }

        /* Radar scanline effect overlay */
        .radar-scanline {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(16, 185, 129, 0.02) 50%,
                rgba(16, 185, 129, 0.02)
            );
            background-size: 100% 4px;
        }

        /* Tactical Glows */
        .glow-green {
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
            border-color: rgba(16, 185, 129, 0.7);
        }
        
        .glow-cyan {
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
            border-color: rgba(6, 182, 212, 0.7);
        }

        .glow-red {
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
            border-color: rgba(239, 68, 68, 0.7);
        }

        /* Mobile Scrollbar Hide */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Pulse Animation for Wave Button */
        @keyframes radar-pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .btn-pulse {
            animation: radar-pulse 2s infinite;
        }
    </style>

        // --- WEB AUDIO ENGINE WITH MOBILE UNLOCK ---
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.unlocked = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                this.unlocked = true;
            }

            playGun() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(280, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(70, this.ctx.currentTime + 0.04);
                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.04);
                } catch(e) {}
            }

            playMissile() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(500, this.ctx.currentTime + 0.18);
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.18);
                } catch(e) {}
            }

            playExplosion(isHeavy = false) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const duration = isHeavy ? 0.35 : 0.18;
                    const bufferSize = this.ctx.sampleRate * duration;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(isHeavy ? 350 : 700, this.ctx.currentTime);
                    filter.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + duration);

                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(isHeavy ? 0.25 : 0.12, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    noise.start();
                } catch(e) {}
            }
        }

        // --- GAME ENGINE CLASS ---
        class GameEngine {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.dpr = window.devicePixelRatio || 1;

                this.budget = 1200;
                this.wave = 0;
                this.maxWaves = 10;
                this.waveActive = false;
                this.enemiesKilled = 0;
                this.totalEarned = 1200;
                this.timeScale = 1.0;
                this.isPaused = false;

                this.currentMap = MAPS[0];
                this.buildings = [];
                this.towers = [];
                this.enemies = [];
                this.projectiles = [];
                this.particles = [];

                this.selectedBuildType = 'shilka';
                this.selectedTower = null;

                // Drag & Touch State
                this.isDragging = false;
                this.dragPos = { x: 0, y: 0, valid: false };

                this.spawnQueue = [];
                this.spawnTimer = 0;
                this.radarAngle = 0;

                this.initCanvasSize();
                this.bindEvents();
                this.renderBuildPanel();
                this.loadMap(MAPS[0]);

                this.lastTime = performance.now();
                requestAnimationFrame(this.loop.bind(this));
            }

            initCanvasSize() {
                const container = document.getElementById('canvas-container');
                const width = container.clientWidth;
                const height = container.clientHeight;

                this.dpr = Math.min(window.devicePixelRatio || 1, 2); // Cap at 2x for performance
                this.canvas.width = width * this.dpr;
                this.canvas.height = height * this.dpr;

                this.ctx.scale(this.dpr, this.dpr);
                this.cssWidth = width;
                this.cssHeight = height;
            }

            loadMap(mapConfig) {
                this.currentMap = mapConfig;
                document.getElementById('current-map-name').innerText = mapConfig.name;

                this.buildings = mapConfig.buildings.map(b => ({
                    ...b,
                    x: b.x * this.cssWidth,
                    y: b.y * this.cssHeight,
                    currentHp: b.hp
                }));

                this.towers = [];
                this.enemies = [];
                this.projectiles = [];
                this.particles = [];
                this.wave = 0;
                this.waveActive = false;
                this.budget = 1200;
                this.selectedTower = null;
                this.hideInspectPanel();

                this.updateUI();
            }

            bindEvents() {
                window.addEventListener('resize', () => {
                    this.initCanvasSize();
                    this.buildings = this.currentMap.buildings.map(b => ({
                        ...b,
                        x: b.x * this.cssWidth,
                        y: b.y * this.cssHeight,
                        currentHp: b.hp
                    }));
                });

                // Unlock Audio on First User Touch Anywhere
                const unlockAudio = () => {
                    audio.init();
                    window.removeEventListener('touchstart', unlockAudio);
                    window.removeEventListener('click', unlockAudio);
                };
                window.addEventListener('touchstart', unlockAudio, { passive: true });
                window.addEventListener('click', unlockAudio);

                // --- CANVAS TOUCH & DRAG EVENT HANDLING ---
                const getCanvasCoords = (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    return {
                        x: clientX - rect.left,
                        y: clientY - rect.top
                    };
                };

                // Canvas Touch Start / Mouse Down
                const handleStart = (e) => {
                    const pos = getCanvasCoords(e);

                    // Check if tapped existing tower
                    const clickedTower = this.towers.find(t => Math.hypot(t.x - pos.x, t.y - pos.y) < 26);
                    if (clickedTower) {
                        this.selectedTower = clickedTower;
                        this.showInspectPanel(clickedTower);
                        return;
                    }

                    this.hideInspectPanel();
                    this.selectedTower = null;
                };

                this.canvas.addEventListener('mousedown', handleStart);
                this.canvas.addEventListener('touchstart', (e) => {
                    if (this.isDragging) return; // Managed by drag-drop
                    handleStart(e);
                }, { passive: false });

                // UI Top Bar Controls
                document.getElementById('btn-start-wave').addEventListener('click', () => this.startWave());

                document.getElementById('btn-speed').addEventListener('click', () => {
                    if (this.timeScale === 1.0) this.timeScale = 2.0;
                    else if (this.timeScale === 2.0) this.timeScale = 3.0;
                    else this.timeScale = 1.0;
                    document.getElementById('btn-speed').innerText = `x${this.timeScale}`;
                });

                document.getElementById('btn-pause').addEventListener('click', () => {
                    this.isPaused = !this.isPaused;
                    document.getElementById('btn-pause').innerText = this.isPaused ? '▶' : '❚❚';
                    document.getElementById('btn-pause').classList.toggle('text-amber-400', this.isPaused);
                });

                document.getElementById('btn-audio').addEventListener('click', () => {
                    audio.enabled = !audio.enabled;
                    document.getElementById('audio-icon').style.opacity = audio.enabled ? '1' : '0.3';
                });

                document.getElementById('btn-change-map').addEventListener('click', () => this.openMapModal());
                document.getElementById('btn-close-map-modal').addEventListener('click', () => {
                    document.getElementById('map-modal').classList.add('hidden');
                });

                // Inspector Drawer Actions
                document.getElementById('btn-close-inspect').addEventListener('click', () => {
                    this.hideInspectPanel();
                    this.selectedTower = null;
                });

                document.getElementById('btn-upgrade-unit').addEventListener('click', () => {
                    if (!this.selectedTower) return;
                    const cost = Math.floor(this.selectedTower.cost * 0.75 * this.selectedTower.level);
                    if (this.budget >= cost) {
                        this.budget -= cost;
                        this.selectedTower.level++;
                        this.selectedTower.range *= 1.12;
                        this.selectedTower.damage *= 1.25;
                        this.selectedTower.reloadTime *= 0.92;
                        this.updateUI();
                        this.showInspectPanel(this.selectedTower);
                    }
                });

                document.getElementById('btn-sell-unit').addEventListener('click', () => {
                    if (!this.selectedTower) return;
                    const refund = Math.floor(this.selectedTower.cost * 0.6 * this.selectedTower.level);
                    this.budget += refund;
                    this.towers = this.towers.filter(t => t !== this.selectedTower);
                    this.selectedTower = null;
                    this.hideInspectPanel();
                    this.updateUI();
                });

                document.getElementById('btn-restart').addEventListener('click', () => {
                    document.getElementById('game-over-modal').classList.add('hidden');
                    this.loadMap(this.currentMap);
                });
            }

            isValidPlacement(x, y) {
                // Bounds Check
                if (y < 35 || y > this.cssHeight - 20 || x < 25 || x > this.cssWidth - 25) return false;

                // Building Collisions
                for (let b of this.buildings) {
                    if (x > b.x - b.w / 2 - 18 && x < b.x + b.w / 2 + 18 &&
                        y > b.y - b.h / 2 - 18 && y < b.y + b.h / 2 + 18) {
                        return false;
                    }
                }

                // Distance from other towers
                for (let t of this.towers) {
                    if (Math.hypot(t.x - x, t.y - y) < 32) return false;
                }

                // Mountains Collision
                for (let m of (this.currentMap.mountains || [])) {
                    const mx = m.x * this.cssWidth;
                    const my = m.y * this.cssHeight;
                    if (Math.hypot(mx - x, my - y) < m.r + 8) return false;
                }

                return true;
            }

            renderBuildPanel() {
                const container = document.getElementById('turret-scroll-list');
                container.innerHTML = '';

                Object.values(TOWER_TYPES).forEach(t => {
                    const card = document.createElement('div');
                    card.className = `flex-shrink-0 w-32 p-2 rounded-xl border bg-slate-950/80 active:scale-95 transition flex flex-col justify-between cursor-pointer select-none ${
                        this.selectedBuildType === t.id 
                            ? 'border-emerald-500 glow-green' 
                            : 'border-slate-800'
                    }`;

                    card.innerHTML = `
                        <div class="flex items-center justify-between">
                            <span class="font-tech font-bold text-xs truncate" style="color: ${t.color}">${t.name}</span>
                        </div>
                        <div class="text-[10px] text-slate-400 font-mono my-1 truncate">${t.shortDesc}</div>
                        <div class="flex justify-between items-center text-[11px] font-tech font-bold text-emerald-400 mt-0.5">
                            <span>$${t.cost}</span>
                            <span class="text-[9px] text-slate-500 font-mono">ТЯНИ ➔</span>
                        </div>
                    `;

                    // Drag & Drop Handling for Mobile Cards
                    const startDrag = (e) => {
                        this.selectedBuildType = t.id;
                        this.isDragging = true;
                        document.getElementById('drag-hint').classList.remove('hidden');
                        this.renderBuildPanel();
                    };

                    const moveDrag = (e) => {
                        if (!this.isDragging) return;
                        e.preventDefault();
                        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                        const rect = this.canvas.getBoundingClientRect();

                        // Finger offset so circle is visible above touch point
                        this.dragPos.x = clientX - rect.left;
                        this.dragPos.y = clientY - rect.top - 25; 
                        this.dragPos.valid = this.isValidPlacement(this.dragPos.x, this.dragPos.y);
                    };

                    const endDrag = (e) => {
                        if (!this.isDragging) return;
                        this.isDragging = false;
                        document.getElementById('drag-hint').classList.add('hidden');

                        if (this.dragPos.valid) {
                            const template = TOWER_TYPES[this.selectedBuildType];
                            if (this.budget >= template.cost) {
                                this.budget -= template.cost;
                                this.towers.push({
                                    ...template,
                                    x: this.dragPos.x,
                                    y: this.dragPos.y,
                                    level: 1,
                                    lastShot: 0,
                                    kills: 0
                                });
                                this.selectedTower = this.towers[this.towers.length - 1];
                                this.showInspectPanel(this.selectedTower);
                                this.updateUI();
                            }
                        }
                        this.dragPos.valid = false;
                    };

                    card.addEventListener('touchstart', startDrag, { passive: true });
                    card.addEventListener('touchmove', moveDrag, { passive: false });
                    card.addEventListener('touchend', endDrag);

                    card.addEventListener('mousedown', startDrag);
                    window.addEventListener('mousemove', moveDrag);
                    window.addEventListener('mouseup', endDrag);

                    container.appendChild(card);
                });
            }

            showInspectPanel(tower) {
                const panel = document.getElementById('unit-inspector');
                panel.classList.remove('hidden');

                document.getElementById('inspect-name').innerText = tower.name;
                document.getElementById('inspect-name').style.color = tower.color;
                document.getElementById('inspect-icon').style.backgroundColor = tower.color;
                document.getElementById('inspect-range').innerText = Math.round(tower.range);
                document.getElementById('inspect-damage').innerText = Math.round(tower.damage);
                document.getElementById('inspect-kills').innerText = tower.kills || 0;
                document.getElementById('inspect-level').innerText = `Ур. ${tower.level}`;

                const upgradeCost = Math.floor(tower.cost * 0.75 * tower.level);
                const sellCost = Math.floor(tower.cost * 0.6 * tower.level);
                document.getElementById('inspect-upgrade-cost').innerText = `($${upgradeCost})`;
                document.getElementById('inspect-sell-cost').innerText = `($${sellCost})`;
            }

            hideInspectPanel() {
                document.getElementById('unit-inspector').classList.add('hidden');
            }

            openMapModal() {
                const container = document.getElementById('map-list-container');
                container.innerHTML = '';

                MAPS.forEach(m => {
                    const card = document.createElement('div');
                    card.className = `p-3 rounded-xl border bg-slate-950/80 active:scale-95 cursor-pointer transition space-y-1 ${
                        this.currentMap.id === m.id ? 'border-emerald-500 glow-green' : 'border-slate-800'
                    }`;

                    card.onclick = () => {
                        this.loadMap(m);
                        document.getElementById('map-modal').classList.add('hidden');
                    };

                    card.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="font-tech font-bold text-emerald-400 text-sm">${m.name}</span>
                            <span class="text-[10px] font-mono bg-slate-800 text-slate-300 px-2 py-0.5 rounded">Объектов: ${m.buildings.length}</span>
                        </div>
                        <p class="text-xs text-slate-400 font-mono">${m.desc}</p>
                    `;
                    container.appendChild(card);
                });

                document.getElementById('map-modal').classList.remove('hidden');
            }

            startWave() {
                if (this.waveActive) return;
                this.wave++;
                this.waveActive = true;
                document.getElementById('btn-start-wave').classList.add('hidden');

                this.spawnQueue = [];
                const count = 5 + this.wave * 4;

                for (let i = 0; i < count; i++) {
                    let type = 'drone';
                    const rand = Math.random();

                    if (this.wave >= 2 && rand > 0.6) type = 'kamikaze';
                    if (this.wave >= 3 && rand > 0.75) type = 'cruise_missile';
                    if (this.wave >= 5 && rand > 0.82) type = 'ballistic';
                    if (this.wave >= 7 && rand > 0.90) type = 'stealth_bomber';

                    this.spawnQueue.push({
                        type: type,
                        delay: i * (1.6 - Math.min(1.0, this.wave * 0.08))
                    });
                }

                const banner = document.getElementById('wave-banner');
                document.getElementById('wave-banner-title').innerText = `ВОЛНА ${this.wave} ИЗ ${this.maxWaves}`;
                banner.classList.remove('hidden');
                setTimeout(() => banner.classList.add('hidden'), 2500);

                this.updateUI();
            }

            spawnEnemy(typeKey) {
                const template = ENEMY_TYPES[typeKey];
                const startX = Math.random() * (this.cssWidth - 60) + 30;

                const aliveBuildings = this.buildings.filter(b => b.currentHp > 0);
                if (aliveBuildings.length === 0) return;
                const targetBuilding = aliveBuildings[Math.floor(Math.random() * aliveBuildings.length)];

                this.enemies.push({
                    ...template,
                    x: startX,
                    y: -10,
                    maxHp: template.hp * (1 + (this.wave - 1) * 0.18),
                    hp: template.hp * (1 + (this.wave - 1) * 0.18),
                    targetX: targetBuilding.x,
                    targetY: targetBuilding.y,
                    slowTimer: 0
                });
            }

            updateUI() {
                document.getElementById('ui-budget').innerText = Math.floor(this.budget);
                document.getElementById('ui-wave-num').innerText = this.wave + 1;

                let totalMaxHp = 0;
                let totalHp = 0;
                this.buildings.forEach(b => {
                    totalMaxHp += b.maxHp;
                    totalHp += Math.max(0, b.currentHp);
                });
                const pct = Math.max(0, Math.floor((totalHp / totalMaxHp) * 100));

                const hpBar = document.getElementById('ui-health-bar');
                hpBar.style.width = `${pct}%`;
                document.getElementById('ui-health-text').innerText = `${pct}%`;

                if (pct < 30) hpBar.className = 'bg-rose-500 h-full rounded-full transition-all duration-300';
                else if (pct < 60) hpBar.className = 'bg-amber-500 h-full rounded-full transition-all duration-300';
                else hpBar.className = 'bg-emerald-500 h-full rounded-full transition-all duration-300';
            }

            // --- MAIN GAME LOOP ---
            loop(timestamp) {
                const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1) * (this.isPaused ? 0 : this.timeScale);
                this.lastTime = timestamp;

                this.update(dt);
                this.render();

                requestAnimationFrame(this.loop.bind(this));
            }

            update(dt) {
                if (dt === 0) return;

                this.radarAngle += dt * 1.2;

                // Spawning Queue
                if (this.spawnQueue.length > 0) {
                    this.spawnTimer += dt;
                    if (this.spawnTimer >= this.spawnQueue[0].delay) {
                        const item = this.spawnQueue.shift();
                        this.spawnEnemy(item.type);
                        this.spawnTimer = 0;
                    }
                } else if (this.waveActive && this.enemies.length === 0) {
                    this.waveActive = false;
                    this.budget += 180 + this.wave * 40;
                    this.updateUI();
                    document.getElementById('btn-start-wave').classList.remove('hidden');

                    if (this.wave >= this.maxWaves) {
                        this.triggerGameOver(true);
                    }
                }

                // Radar Boosts
                this.towers.forEach(t => t.effectiveRange = t.range * this.currentMap.radarModifier);
                this.towers.filter(t => t.type === 'radar').forEach(radar => {
                    this.towers.forEach(other => {
                        if (other !== radar && Math.hypot(other.x - radar.x, other.y - radar.y) < radar.effectiveRange) {
                            other.effectiveRange *= (1 + radar.buffBonus);
                        }
                    });
                });

                // Tower Firing
                const now = performance.now() / 1000;
                this.towers.forEach(t => {
                    if (t.type === 'radar') return;

                    if (t.type === 'ew') {
                        this.enemies.forEach(e => {
                            if (Math.hypot(e.x - t.x, e.y - t.y) < t.effectiveRange) {
                                e.slowTimer = 0.4;
                            }
                        });
                        return;
                    }

                    if (now - t.lastShot >= t.reloadTime) {
                        let target = null;
                        let minDist = t.effectiveRange;

                        this.enemies.forEach(e => {
                            const d = Math.hypot(e.x - t.x, e.y - t.y);
                            if (d < minDist) {
                                minDist = d;
                                target = e;
                            }
                        });

                        if (target) {
                            t.lastShot = now;
                            this.fireProjectile(t, target);
                        }
                    }
                });

                // Update Enemies
                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const e = this.enemies[i];

                    let currentSpeed = e.speed;
                    if (e.slowTimer > 0) {
                        e.slowTimer -= dt;
                        currentSpeed *= 0.55;
                    }

                    const dx = e.targetX - e.x;
                    const dy = e.targetY - e.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < 12) {
                        const b = this.buildings.find(b => Math.hypot(b.x - e.targetX, b.y - e.targetY) < 20);
                        if (b) {
                            b.currentHp -= e.hp * 0.8;
                            this.createExplosion(e.x, e.y, e.color, 20);
                            audio.playExplosion(true);
                            this.updateUI();

                            const alive = this.buildings.some(b => b.currentHp > 0);
                            if (!alive) this.triggerGameOver(false);
                        }
                        this.enemies.splice(i, 1);
                        continue;
                    }

                    e.x += (dx / dist) * currentSpeed * dt;
                    e.y += (dy / dist) * currentSpeed * dt;
                }

                // Update Projectiles
                for (let i = this.projectiles.length - 1; i >= 0; i--) {
                    const p = this.projectiles[i];

                    if (p.isGun) {
                        p.x += p.vx * dt;
                        p.y += p.vy * dt;
                        p.life -= dt;

                        if (p.target && Math.hypot(p.target.x - p.x, p.target.y - p.y) < p.target.size + 4) {
                            p.target.hp -= p.damage;
                            if (p.target.hp <= 0 && p.owner) p.owner.kills = (p.owner.kills || 0) + 1;
                            this.createParticles(p.x, p.y, p.color, 2);
                            p.life = 0;
                        }

                        if (p.life <= 0) this.projectiles.splice(i, 1);
                    } else {
                        if (!p.target || p.target.hp <= 0) {
                            let closest = null;
                            let minDist = 180;
                            this.enemies.forEach(e => {
                                const d = Math.hypot(e.x - p.x, e.y - p.y);
                                if (d < minDist) { minDist = d; closest = e; }
                            });
                            p.target = closest;
                        }

                        if (p.target) {
                            const angle = Math.atan2(p.target.y - p.y, p.target.x - p.x);
                            p.vx = Math.cos(angle) * p.speed;
                            p.vy = Math.sin(angle) * p.speed;
                        }

                        p.x += p.vx * dt;
                        p.y += p.vy * dt;

                        if (Math.random() < 0.4) {
                            this.particles.push({
                                x: p.x, y: p.y,
                                vx: (Math.random() - 0.5) * 8,
                                vy: (Math.random() - 0.5) * 8,
                                life: 0.2, maxLife: 0.2,
                                size: 2, color: '#94a3b8'
                            });
                        }

                        if (p.target && Math.hypot(p.target.x - p.x, p.target.y - p.y) < 10) {
                            if (p.splash > 0) {
                                this.enemies.forEach(e => {
                                    if (Math.hypot(e.x - p.x, e.y - p.y) <= p.splash) {
                                        e.hp -= p.damage;
                                        if (e.hp <= 0 && p.owner) p.owner.kills = (p.owner.kills || 0) + 1;
                                    }
                                });
                                this.createExplosion(p.x, p.y, p.color, p.splash * 0.7);
                            } else {
                                p.target.hp -= p.damage;
                                if (p.target.hp <= 0 && p.owner) p.owner.kills = (p.owner.kills || 0) + 1;
                                this.createExplosion(p.x, p.y, p.color, 12);
                            }

                            audio.playExplosion(p.splash > 30);
                            this.projectiles.splice(i, 1);
                        }
                    }
                }

                // Remove Dead Enemies
                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const e = this.enemies[i];
                    if (e.hp <= 0) {
                        this.budget += e.reward;
                        this.totalEarned += e.reward;
                        this.enemiesKilled++;
                        this.createExplosion(e.x, e.y, e.color, 16);
                        this.enemies.splice(i, 1);
                        this.updateUI();
                    }
                }

                // Update Particles (Capped for mobile performance)
                if (this.particles.length > 120) this.particles.splice(0, 30);
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const pt = this.particles[i];
                    pt.x += pt.vx * dt;
                    pt.y += pt.vy * dt;
                    pt.life -= dt;
                    if (pt.life <= 0) this.particles.splice(i, 1);
                }
            }

            fireProjectile(tower, target) {
                if (tower.type === 'gun') {
                    const angle = Math.atan2(target.y - tower.y, target.x - tower.x);
                    this.projectiles.push({
                        isGun: true,
                        x: tower.x, y: tower.y,
                        vx: Math.cos(angle) * tower.bulletSpeed,
                        vy: Math.sin(angle) * tower.bulletSpeed,
                        damage: tower.damage,
                        target: target,
                        owner: tower,
                        life: 0.35,
                        color: tower.color
                    });
                    audio.playGun();
                } else {
                    const angle = Math.atan2(target.y - tower.y, target.x - tower.x);
                    this.projectiles.push({
                        isGun: false,
                        x: tower.x, y: tower.y,
                        vx: Math.cos(angle) * tower.bulletSpeed,
                        vy: Math.sin(angle) * tower.bulletSpeed,
                        speed: tower.bulletSpeed,
                        damage: tower.damage,
                        splash: tower.splash,
                        target: target,
                        owner: tower,
                        color: tower.color
                    });
                    audio.playMissile();
                }
            }

            createParticles(x, y, color, count) {
                for (let i = 0; i < count; i++) {
                    this.particles.push({
                        x: x, y: y,
                        vx: (Math.random() - 0.5) * 60,
                        vy: (Math.random() - 0.5) * 60,
                        life: 0.2, maxLife: 0.2,
                        size: Math.random() * 2 + 1,
                        color: color
                    });
                }
            }

            createExplosion(x, y, color, radius) {
                for (let i = 0; i < 12; i++) {
                    const ang = Math.random() * Math.PI * 2;
                    const spd = Math.random() * radius * 2.5;
                    this.particles.push({
                        x: x, y: y,
                        vx: Math.cos(ang) * spd,
                        vy: Math.sin(ang) * spd,
                        life: 0.35, maxLife: 0.35,
                        size: Math.random() * 3 + 1.5,
                        color: i % 2 === 0 ? '#f97316' : color
                    });
                }
            }

            triggerGameOver(isVictory) {
                this.isPaused = true;
                const modal = document.getElementById('game-over-modal');
                const title = document.getElementById('game-over-title');
                const desc = document.getElementById('game-over-desc');

                if (isVictory) {
                    title.innerText = 'ПОБЕДА! НЕБО ПОД КОНТРОЛЕМ';
                    title.className = 'font-tech text-lg sm:text-xl font-bold text-emerald-400';
                    desc.innerText = 'Все волны противника отражены.';
                } else {
                    title.innerText = 'ОБЪЕКТЫ УНИЧТОЖЕНЫ';
                    title.className = 'font-tech text-lg sm:text-xl font-bold text-rose-500';
                    desc.innerText = 'Вражеские ракеты прорвали купол ПВО.';
                }

                document.getElementById('stat-waves').innerText = `${this.wave} / ${this.maxWaves}`;
                document.getElementById('stat-kills').innerText = this.enemiesKilled;
                document.getElementById('stat-money').innerText = `$${this.totalEarned}`;

                modal.classList.remove('hidden');
            }

            // --- RENDERING ---
            render() {
                const w = this.cssWidth;
                const h = this.cssHeight;

                this.ctx.fillStyle = this.currentMap.bgStyle;
                this.ctx.fillRect(0, 0, w, h);

                // Grid
                this.ctx.strokeStyle = this.currentMap.gridColor;
                this.ctx.lineWidth = 1;
                const gridSize = 40;
                for (let x = 0; x < w; x += gridSize) {
                    this.ctx.beginPath(); this.ctx.moveTo(x, 0); this.ctx.lineTo(x, h); this.ctx.stroke();
                }
                for (let y = 0; y < h; y += gridSize) {
                    this.ctx.beginPath(); this.ctx.moveTo(0, y); this.ctx.lineTo(w, y); this.ctx.stroke();
                }

                // Radar Circles
                const centerX = w / 2;
                const centerY = h / 2;
                this.ctx.save();
                this.ctx.strokeStyle = 'rgba(16, 185, 129, 0.12)';
                [100, 220, 340].forEach(r => {
                    this.ctx.beginPath(); this.ctx.arc(centerX, centerY, r, 0, Math.PI * 2); this.ctx.stroke();
                });

                // Radar Sweeper
                this.ctx.beginPath();
                this.ctx.moveTo(centerX, centerY);
                this.ctx.arc(centerX, centerY, 500, this.radarAngle, this.radarAngle + 0.3);
                this.ctx.closePath();
                this.ctx.fillStyle = 'rgba(16, 185, 129, 0.03)';
                this.ctx.fill();
                this.ctx.restore();

                // Mountains
                (this.currentMap.mountains || []).forEach(m => {
                    const mx = m.x * w;
                    const my = m.y * h;
                    this.ctx.fillStyle = 'rgba(30, 41, 59, 0.7)';
                    this.ctx.strokeStyle = 'rgba(71, 85, 105, 0.5)';
                    this.ctx.beginPath(); this.ctx.arc(mx, my, m.r, 0, Math.PI * 2); this.ctx.fill(); this.ctx.stroke();
                });

                // Protected Buildings
                this.buildings.forEach(b => {
                    if (b.currentHp <= 0) return;

                    this.ctx.save();
                    this.ctx.fillStyle = '#1e293b';
                    this.ctx.strokeStyle = '#06b6d4';
                    this.ctx.lineWidth = 1.5;

                    this.ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
                    this.ctx.strokeRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);

                    this.ctx.fillStyle = '#94a3b8';
                    this.ctx.font = '9px Share Tech Mono';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(b.name, b.x, b.y - b.h / 2 - 5);

                    const hpPct = b.currentHp / b.maxHp;
                    this.ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
                    this.ctx.fillRect(b.x - b.w / 2, b.y + b.h / 2 + 3, b.w, 3);
                    this.ctx.fillStyle = hpPct > 0.5 ? '#10b981' : hpPct > 0.25 ? '#f59e0b' : '#ef4444';
                    this.ctx.fillRect(b.x - b.w / 2, b.y + b.h / 2 + 3, b.w * hpPct, 3);
                    this.ctx.restore();
                });

                // Placement Drag Indicator Circle
                if (this.isDragging) {
                    const template = TOWER_TYPES[this.selectedBuildType];
                    const effectiveR = template.range * this.currentMap.radarModifier;

                    this.ctx.save();
                    this.ctx.beginPath();
                    this.ctx.arc(this.dragPos.x, this.dragPos.y, effectiveR, 0, Math.PI * 2);
                    this.ctx.fillStyle = this.dragPos.valid ? 'rgba(16, 185, 129, 0.15)' : 'rgba(239, 68, 68, 0.15)';
                    this.ctx.strokeStyle = this.dragPos.valid ? '#10b981' : '#ef4444';
                    this.ctx.lineWidth = 2;
                    this.ctx.fill();
                    this.ctx.stroke();

                    this.ctx.fillStyle = template.color;
                    this.ctx.beginPath();
                    this.ctx.arc(this.dragPos.x, this.dragPos.y, 10, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                }

                // Towers
                this.towers.forEach(t => {
                    const isSelected = this.selectedTower === t;

                    this.ctx.save();
                    if (isSelected) {
                        this.ctx.beginPath();
                        this.ctx.arc(t.x, t.y, t.effectiveRange, 0, Math.PI * 2);
                        this.ctx.fillStyle = 'rgba(6, 182, 212, 0.08)';
                        this.ctx.strokeStyle = '#06b6d4';
                        this.ctx.lineWidth = 1.5;
                        this.ctx.setLineDash([4, 4]);
                        this.ctx.fill();
                        this.ctx.stroke();
                        this.ctx.setLineDash([]);
                    }

                    this.ctx.fillStyle = '#0f172a';
                    this.ctx.strokeStyle = t.color;
                    this.ctx.lineWidth = 2;
                    this.ctx.beginPath();
                    this.ctx.arc(t.x, t.y, 12, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.stroke();

                    this.ctx.fillStyle = t.color;
                    if (t.type === 'gun') {
                        this.ctx.fillRect(t.x - 2.5, t.y - 7, 5, 14);
                    } else if (t.type === 'missile' || t.type === 'heavy_missile') {
                        this.ctx.beginPath();
                        this.ctx.moveTo(t.x, t.y - 7);
                        this.ctx.lineTo(t.x + 6, t.y + 5);
                        this.ctx.lineTo(t.x - 6, t.y + 5);
                        this.ctx.closePath();
                        this.ctx.fill();
                    } else if (t.type === 'ew') {
                        this.ctx.beginPath(); this.ctx.arc(t.x, t.y, 5, 0, Math.PI * 2); this.ctx.stroke();
                    } else if (t.type === 'radar') {
                        this.ctx.beginPath(); this.ctx.arc(t.x, t.y, 7, this.radarAngle, this.radarAngle + Math.PI); this.ctx.stroke();
                    }
                    this.ctx.restore();
                });

                // Enemies
                this.enemies.forEach(e => {
                    this.ctx.save();
                    const angle = Math.atan2(e.targetY - e.y, e.targetX - e.x);

                    this.ctx.translate(e.x, e.y);
                    this.ctx.rotate(angle);

                    this.ctx.fillStyle = e.color;
                    this.ctx.strokeStyle = '#000000';
                    this.ctx.lineWidth = 1;

                    this.ctx.beginPath();
                    this.ctx.moveTo(e.size * 1.4, 0);
                    this.ctx.lineTo(-e.size, -e.size);
                    this.ctx.lineTo(-e.size * 0.4, 0);
                    this.ctx.lineTo(-e.size, e.size);
                    this.ctx.closePath();
                    this.ctx.fill();
                    this.ctx.stroke();
                    this.ctx.restore();

                    if (e.hp < e.maxHp) {
                        const pct = Math.max(0, e.hp / e.maxHp);
                        this.ctx.fillStyle = 'rgba(0,0,0,0.6)';
                        this.ctx.fillRect(e.x - 10, e.y - e.size - 6, 20, 2.5);
                        this.ctx.fillStyle = '#ef4444';
                        this.ctx.fillRect(e.x - 10, e.y - e.size - 6, 20 * pct, 2.5);
                    }
                });

                // Projectiles
                this.projectiles.forEach(p => {
                    this.ctx.save();
                    this.ctx.fillStyle = p.color;
                    this.ctx.strokeStyle = p.color;

                    if (p.isGun) {
                        this.ctx.beginPath();
                        this.ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                        this.ctx.fill();
                    } else {
                        this.ctx.lineWidth = 2;
                        this.ctx.beginPath();
                        this.ctx.moveTo(p.x, p.y);
                        this.ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03);
                        this.ctx.stroke();
                    }
                    this.ctx.restore();
                });

                // Particles
                this.particles.forEach(pt => {
                    this.ctx.save();
                    this.ctx.globalAlpha = pt.life / pt.maxLife;
                    this.ctx.fillStyle = pt.color;
                    this.ctx.beginPath();
                    this.ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                });
            }
        }

        // Initialize Game Engine on Window Load
        window.onload = () => {
            window.game = new GameEngine();
        };
    </script>
</body>
</html>
